# Render.com blueprint. Other hosts (Railway, Heroku, Fly) read the Procfile
# instead — both say the same thing: install requirements.txt, run wsgi:app.
services:
  - type: web
    name: decode
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DECODE_SECRET      # so logins survive a redeploy
        generateValue: true
      - key: DECODE_DATA        # where the database lives — point at a mounted disk
        value: /var/data
